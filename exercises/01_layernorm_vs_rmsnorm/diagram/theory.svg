<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 690"><defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern>
<marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker>
<style>text{font-family:'SF Mono','Cascadia Code',monospace;fill:#e2e8f0}</style></defs>
<rect width="100%" height="100%" fill="#0f172a"/><rect width="100%" height="100%" fill="url(#grid)"/>
<text x="30" y="36" font-size="22" fill="#e2e8f0" style="fill:#e2e8f0" text-anchor="start">LayerNorm vs RMSNorm: what changes in training?</text>
<text x="30" y="62" font-size="13" fill="#94a3b8" style="fill:#94a3b8" text-anchor="start">Conceptual operation and storage diagram — not measured execution time</text>
<text x="35" y="150" font-size="17" fill="#22d3ee" style="fill:#22d3ee" text-anchor="start">LayerNorm</text>
<path d="M435 145H475" stroke="#94a3b8" marker-end="url(#arrow)"/>
<path d="M740 145H780" stroke="#94a3b8" marker-end="url(#arrow)"/>
<rect x="180" y="110" width="255" height="70" rx="8" fill="#0f172a"/>
<rect x="180" y="110" width="255" height="70" rx="8" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee"/>
<text x="307.5" y="138" font-size="15" fill="#e2e8f0" style="fill:#e2e8f0" text-anchor="middle">Center each row</text>
<text x="307.5" y="159" font-size="11" fill="#94a3b8" style="fill:#94a3b8" text-anchor="middle">z = x - mean(x)</text>
<rect x="475" y="110" width="265" height="70" rx="8" fill="#0f172a"/>
<rect x="475" y="110" width="265" height="70" rx="8" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee"/>
<text x="607.5" y="138" font-size="15" fill="#e2e8f0" style="fill:#e2e8f0" text-anchor="middle">Scale by inverse RMS</text>
<text x="607.5" y="159" font-size="11" fill="#94a3b8" style="fill:#94a3b8" text-anchor="middle">z / sqrt(mean(z²) + eps)</text>
<rect x="780" y="110" width="280" height="70" rx="8" fill="#0f172a"/>
<rect x="780" y="110" width="280" height="70" rx="8" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee"/>
<text x="920.0" y="138" font-size="15" fill="#e2e8f0" style="fill:#e2e8f0" text-anchor="middle">Apply learned scale</text>
<text x="920.0" y="159" font-size="11" fill="#94a3b8" style="fill:#94a3b8" text-anchor="middle">y = normalized(z) × weight</text>
<text x="35" y="270" font-size="17" fill="#34d399" style="fill:#34d399" text-anchor="start">RMSNorm</text>
<path d="M435 265H475" stroke="#94a3b8" marker-end="url(#arrow)"/>
<path d="M740 265H780" stroke="#94a3b8" marker-end="url(#arrow)"/>
<rect x="180" y="230" width="255" height="70" rx="8" fill="#0f172a"/>
<rect x="180" y="230" width="255" height="70" rx="8" fill="#34d399" fill-opacity=".12" stroke="#34d399"/>
<text x="307.5" y="258" font-size="15" fill="#e2e8f0" style="fill:#e2e8f0" text-anchor="middle">Keep input values</text>
<text x="307.5" y="279" font-size="11" fill="#94a3b8" style="fill:#94a3b8" text-anchor="middle">z = x</text>
<rect x="475" y="230" width="265" height="70" rx="8" fill="#0f172a"/>
<rect x="475" y="230" width="265" height="70" rx="8" fill="#34d399" fill-opacity=".12" stroke="#34d399"/>
<text x="607.5" y="258" font-size="15" fill="#e2e8f0" style="fill:#e2e8f0" text-anchor="middle">Scale by inverse RMS</text>
<text x="607.5" y="279" font-size="11" fill="#94a3b8" style="fill:#94a3b8" text-anchor="middle">z / sqrt(mean(z²) + eps)</text>
<rect x="780" y="230" width="280" height="70" rx="8" fill="#0f172a"/>
<rect x="780" y="230" width="280" height="70" rx="8" fill="#34d399" fill-opacity=".12" stroke="#34d399"/>
<text x="920.0" y="258" font-size="15" fill="#e2e8f0" style="fill:#e2e8f0" text-anchor="middle">Apply learned scale</text>
<text x="920.0" y="279" font-size="11" fill="#94a3b8" style="fill:#94a3b8" text-anchor="middle">y = normalized(z) × weight</text>
<text x="35" y="340" font-size="14" fill="#e2e8f0" style="fill:#e2e8f0" text-anchor="start">Same shapes, epsilon, scale, dtype and loss. LayerNorm bias disabled.</text>
<text x="35" y="365" font-size="13" fill="#94a3b8" style="fill:#94a3b8" text-anchor="start">Each norm has its own output and gradient reference; outputs need not match.</text>
<text x="35" y="410" font-size="19" fill="#e2e8f0" style="fill:#e2e8f0" text-anchor="start">Training keeps information that inference can release</text>
<path d="M285 477H330" stroke="#94a3b8" marker-end="url(#arrow)"/>
<path d="M565 477H610" stroke="#94a3b8" marker-end="url(#arrow)"/>
<path d="M845 477H890" stroke="#94a3b8" marker-end="url(#arrow)"/>
<rect x="35" y="442" width="250" height="70" rx="8" fill="#0f172a"/>
<rect x="35" y="442" width="250" height="70" rx="8" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee"/>
<text x="160.0" y="470" font-size="15" fill="#e2e8f0" style="fill:#e2e8f0" text-anchor="middle">Inputs + weights</text>
<text x="160.0" y="491" font-size="11" fill="#94a3b8" style="fill:#94a3b8" text-anchor="middle">baseline allocation</text>
<rect x="330" y="442" width="235" height="70" rx="8" fill="#0f172a"/>
<rect x="330" y="442" width="235" height="70" rx="8" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa"/>
<text x="447.5" y="470" font-size="15" fill="#e2e8f0" style="fill:#e2e8f0" text-anchor="middle">Forward + loss</text>
<text x="447.5" y="491" font-size="11" fill="#94a3b8" style="fill:#94a3b8" text-anchor="middle">output and saved tensors</text>
<rect x="610" y="442" width="235" height="70" rx="8" fill="#0f172a"/>
<rect x="610" y="442" width="235" height="70" rx="8" fill="#34d399" fill-opacity=".12" stroke="#34d399"/>
<text x="727.5" y="470" font-size="15" fill="#e2e8f0" style="fill:#e2e8f0" text-anchor="middle">Backward</text>
<text x="727.5" y="491" font-size="11" fill="#94a3b8" style="fill:#94a3b8" text-anchor="middle">input and weight gradients</text>
<rect x="890" y="442" width="175" height="70" rx="8" fill="#0f172a"/>
<rect x="890" y="442" width="175" height="70" rx="8" fill="#94a3b8" fill-opacity=".12" stroke="#94a3b8"/>
<text x="977.5" y="470" font-size="15" fill="#e2e8f0" style="fill:#e2e8f0" text-anchor="middle">Release</text>
<text x="977.5" y="491" font-size="11" fill="#94a3b8" style="fill:#94a3b8" text-anchor="middle">saved buffers</text>
<text x="35" y="557" font-size="16" fill="#fbbf24" style="fill:#fbbf24" text-anchor="start">Peak live allocation ≠ reserved allocator pool ≠ DRAM bytes transferred</text>
<text x="35" y="588" font-size="13" fill="#94a3b8" style="fill:#94a3b8" text-anchor="start">Saved-tensor accounting deduplicates storage shared by views and inputs.</text>
<text x="35" y="613" font-size="13" fill="#94a3b8" style="fill:#94a3b8" text-anchor="start">Compare native, eager and compiled families separately; implementation matters.</text>
<text x="35" y="648" font-size="12" fill="#94a3b8" style="fill:#94a3b8" text-anchor="start">Timed passes exclude hooks and snapshots. Optimizer updates are outside this study.</text>
</svg>
